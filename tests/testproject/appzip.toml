[project]
name = "testapp"
version = "1.2.3"
description = "Just a test project with minimal functionality."
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
appzip = [
    "tomli-w",
]

[project.entry-points."appzip.scripts"]
testapp = "app:main"

[project.entry-points."appzip.scripts.console"]
testapp_console = "app:main"

[project.entry-points."appzip.scripts.gui"]
testapp_gui = "app:main"

[tool.appzip]
exclude = ["build", "dist", "exclude.txt", "hidden"]