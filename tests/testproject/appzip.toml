[project]
name = "testapp"
version = "1.2.3"
description = "Just a test project with minimal functionality."
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
appzip = [
    "tomli-w",
]

[project.scripts]
default = "testproject:main.main"

[project.gui-scripts]
default_gui = "testproject:main.main"

[project.entry-points."appzip.ep"]
testapp = "testproject"

[project.entry-points."appzip.ep.console"]
testapp_console = "testproject"

[project.entry-points."appzip.ep.app.w"]
testapp_gui = "testproject"

[tool.appzip]
exclude = ["build", "dist", "exclude.txt", "hidden"]